  <body>
    <button id="nextButton">Next</button>
    
    <script>

    <script type="text/javascript">
    let map;

    // Initialize the map
    async function init() {
      const { Map3DElement } = await google.maps.importLibrary("maps3d");

      const flyToCamera = {
        center: { lat: 48.8584, lng: 2.2945, altitude:0.4044601331829445 },
        tilt: 55,
        range: 1500
      };

      map = new Map3DElement({
        center: { lat: 37.81573807564325, lng: -122.47995130419135, altitude: 0.4044601331829445 },
        tilt: 55.829756387193456,
        range: 1000,
        defaultLabelsDisabled: true
      });

      document.body.append(map);

      map.flyCameraTo({
        endCamera: flyToCamera,
        durationMillis: 5000,
      });

      map.addEventListener('gmp-animationend', () => {
        map.flyCameraAround({
          camera: flyToCamera,
          durationMillis: 60000,
          rounds: 1
        });
      }, {once: true});
    }

    function calculateBounds(lat, lng, kmRadius) {
        const latOffset = kmRadius / 111; // 1 degree latitude is ~111 km
        const lngOffset = kmRadius / (111 * Math.cos(lat * (Math.PI / 180))); // Adjust for longitude
    
        return {
            south: lat - 0.02,
            west: lng - 0.02,
            north: lat + 0.02,
            east: lng + 0.02
        };
    }

          // Fetch coordinates from the GraphQL API
          async function fetchCoordinates() {
            const query = `
              query {
                generateCoordinates {
                  latitude
                  longitude
                }
              }
            `;
    
            const response = await fetch("/graphql", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ query })
            });
    
            const result = await response.json();
            return result.data.generateCoordinates;
          }

        async function moveNext(lat,lng) {
        const coordinates = await fetchCoordinates(); 
        console.log(coordinates);
        // New location in Europe (Berlin, Germany)
        const nextCity = {
          center: { lat: coordinates.latitude, lng: coordinates.longitude, altitude: 0.40 },  // Coordinates from GraphQL  // Berlin, Germany
          tilt: 65,   // Slightly different tilt
          range: 2000 // Higher range to show a larger area
        };


        // Fly the camera to the new location
        map.flyCameraTo({
          endCamera: nextCity,
          durationMillis: 5000, // 5 seconds to reach Berlin
        });

        // After the flyCameraTo animation, fly around the new location
        map.addEventListener('gmp-animationend', () => {
          map.flyCameraAround({
            camera: nextCity,
            durationMillis: 30000, // Fly around for 30 seconds
            rounds: 2 // Complete 2 rounds around Berlin
          });
        }, {once: true});
        customElements.whenDefined(map.localName).then(() => {
            map.bounds = calculateBounds(coordinates.latitude, coordinates.longitude, 5);
            console.log(map)
          });
    
    }

    document.getElementById('nextButton').addEventListener('click', () => {
      map.stopCameraAnimation();
      moveNext( 52.5200,  13.4050);
    });
    init();
    </script>
